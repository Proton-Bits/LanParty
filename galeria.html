<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria – LanParty Tromba Latas</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    .gallery-hero {
      padding: 140px 20px 60px;
      text-align: center;
    }

    .gallery-section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    .edition-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 32px;
      color: var(--cyan);
      margin-bottom: 20px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 60px;
    }

    .gallery-grid img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.3s, border-color 0.3s;
    }

    .gallery-grid img:hover {
      transform: scale(1.05);
      border-color: var(--cyan);
    }
  </style>
</head>

<body>

<header class="header">
  <div class="logo">
    <img src="assets/logo.jpg">
    <span>Lan<span class="accent">Party</span></span>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="edicoes.html">Edições</a>
    <a href="galeria.html" style="color: var(--cyan);">Galeria</a>
  </nav>
</header>

<section class="gallery-hero">
  <h1 class="hero-title">
    <span class="line1">GALERIA</span>
    <span class="line2">LAN PARTY</span>
  </h1>
  <p class="hero-sub">Todos os momentos registrados das edições</p>
</section>

<!-- GALERIA -->
<div id="gallery"></div>

<script>
const galleryData = {
  "1edicao": ["1.png", "2.png"],
  "2edicao": ["1.png"],
  "3edicao": [],
  "4edicao": [],
  "5edicao": [],
  "6edicao": []
};

const container = document.getElementById("gallery");

Object.entries(galleryData).forEach(([edition, images]) => {

  const section = document.createElement("div");
  section.className = "gallery-section";

  const title = document.createElement("h2");
  title.className = "edition-title";
  title.textContent = edition.replace("edicao", "ª Edição");

  const grid = document.createElement("div");
  grid.className = "gallery-grid";

  images.forEach(img => {
    const image = document.createElement("img");
    image.src = `assets/galeria/${edition}/${img}`;
    grid.appendChild(image);
  });

  section.appendChild(title);
  section.appendChild(grid);

  container.appendChild(section);
});
</script>

</body>
</html>
